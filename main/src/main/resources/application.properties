quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/
%prod.quarkus.http.auth.permission.search.paths=/search/v1*
%prod.quarkus.http.auth.permission.search.policy=authenticated
%prod.quarkus.http.auth.permission.fetch.paths=/search/v1*
%prod.quarkus.http.auth.permission.fetch.policy=authenticated
%prod.quarkus.http.auth.permission.comparison.paths=/comparison/v1*
%prod.quarkus.http.auth.permission.comparison.policy=authenticated
%prod.quarkus.http.auth.permission.oapi.paths=/q/openapi
%prod.quarkus.http.auth.permission.oapi.policy=permit